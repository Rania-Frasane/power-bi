[project]
name = "analytics-dashboard"
version = "0.1.0"
description = "Django REST API for Power BI-like analytics dashboard"
requires-python = ">=3.9"
dependencies = [
    "Django==4.2.9",
    "djangorestframework==3.14.0",
    "djangorestframework-simplejwt==5.3.2",
    "psycopg2-binary==2.9.9",
    "python-decouple==3.8",
    "django-cors-headers==4.3.1",
    "channels==4.0.0",
    "channels-redis==4.1.0",
    "pandas==2.1.4",
    "openpyxl==3.1.2",
    "requests==2.31.0",
    "Pillow==10.1.0",
    "reportlab==4.0.7",
    "python-dateutil==2.8.2",
    "ai==0.3.0",
    "python-dotenv==1.0.0",
    "numpy==1.24.3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
